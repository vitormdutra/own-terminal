name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Same packages eframe documents for building on Ubuntu.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      # Includes a test that spawns a real pty and runs /bin/sh (takes ~8 s).
      - name: Test
        run: cargo test --release --locked

      - name: Build the macOS app bundle
        if: runner.os == 'macOS'
        run: ./bundle.sh
