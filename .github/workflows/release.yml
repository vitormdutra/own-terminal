name: Release

# Every push to main builds the binaries and publishes a release, bumping the patch version.
# For a minor/major bump, create the release by hand (gh release create v1.6.0 --target main).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # The next version is computed first so the binaries can embed it (the update notice compares against it).
  version:
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.next }}
    steps:
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          echo "next=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    env:
      OWN_TERMINAL_VERSION: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: ./bundle.sh
      - name: Zip it (ditto keeps the bundle intact)
        run: ditto -c -k --keepParent dist/OwnTerminal.app OwnTerminal-macos-apple-silicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OwnTerminal-macos-apple-silicon.zip

  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      OWN_TERMINAL_VERSION: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir own-terminal-linux-x86_64
          cp target/release/own-terminal LICENSE README.md own-terminal-linux-x86_64/
          tar -czf own-terminal-linux-x86_64.tar.gz own-terminal-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: own-terminal-linux-x86_64.tar.gz

  publish:
    needs: [version, macos, linux]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.next }}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes \
            OwnTerminal-macos-apple-silicon.zip own-terminal-linux-x86_64.tar.gz
      # Point the Homebrew cask (vitormdutra/homebrew-tap) at the new zip. Skipped until the HOMEBREW_TAP_TOKEN secret exists.
      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          VERSION: ${{ needs.version.outputs.next }}
        run: |
          sha=$(sha256sum OwnTerminal-macos-apple-silicon.zip | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/vitormdutra/homebrew-tap.git" tap
          cd tap
          sed -i -e "s/^  version \".*\"/  version \"${VERSION#v}\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/own-terminal.rb
          git config user.name github-actions
          git config user.email actions@github.com
          git commit -am "own-terminal $VERSION"
          git push
