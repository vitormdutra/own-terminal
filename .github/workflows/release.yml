name: Release

# Every push to main builds the binaries and publishes a release, bumping the patch version.
# For a minor/major bump, create the release by hand (gh release create v1.6.0 --target main).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: ./bundle.sh
      - name: Zip it (ditto keeps the bundle intact)
        run: ditto -c -k --keepParent dist/OwnTerminal.app OwnTerminal-macos-apple-silicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OwnTerminal-macos-apple-silicon.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir own-terminal-linux-x86_64
          cp target/release/own-terminal LICENSE README.md own-terminal-linux-x86_64/
          tar -czf own-terminal-linux-x86_64.tar.gz own-terminal-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: own-terminal-linux-x86_64.tar.gz

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          next="$major.$minor.$((patch + 1))"
          gh release create "$next" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes \
            OwnTerminal-macos-apple-silicon.zip own-terminal-linux-x86_64.tar.gz
